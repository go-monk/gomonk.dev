{{- define "main" -}}

<article>
  <div class="not-prose">
    <input
      id="search-input"
      type="search"
      placeholder="Search posts..."
      autocomplete="off"
      class="w-full"
    />

    <p id="search-status" class="text-xs opacity-60"></p>

    <ul id="search-results"></ul>
  </div>
</article>

<script>
  (function () {
    var input = document.getElementById('search-input');
    var status = document.getElementById('search-status');
    var results = document.getElementById('search-results');
    var indexUrl = '{{- "index.json" | absURL -}}';
    var pages = null;

    fetch(indexUrl)
      .then(function (res) {
        return res.json();
      })
      .then(function (data) {
        pages = data;
        var params = new URLSearchParams(window.location.search);
        var q = params.get('q');
        if (q) {
          input.value = q;
        }
        render(input.value.trim());
      })
      .catch(function () {
        status.textContent = 'Could not load search index.';
      });

    input.addEventListener('input', function () {
      render(input.value.trim());
    });

    function render(query) {
      results.innerHTML = '';

      if (!pages) {
        status.textContent = 'Loading...';
        return;
      }

      if (!query) {
        status.textContent = '';
        return;
      }

      var needle = query.toLowerCase();
      var matches = pages.filter(function (page) {
        return (
          page.title.toLowerCase().indexOf(needle) !== -1 ||
          page.content.toLowerCase().indexOf(needle) !== -1
        );
      });

      status.textContent =
        matches.length === 0
          ? 'No results for "' + query + '"'
          : matches.length + ' result' + (matches.length === 1 ? '' : 's');

      matches.forEach(function (page) {
        var li = document.createElement('li');
        li.className = 'relative my-8 first:mt-0';

        var h2 = document.createElement('h2');
        h2.className = 'my-0!';
        var a = document.createElement('a');
        a.href = page.permalink;
        a.textContent = page.title;
        h2.appendChild(a);

        var time = document.createElement('time');
        time.className = 'text-xs antialiased opacity-60';
        time.textContent = page.date;

        var p = document.createElement('p');
        p.className = 'mt-1 mb-0 opacity-80';
        p.textContent = snippet(page.content, needle);

        li.appendChild(h2);
        li.appendChild(time);
        li.appendChild(p);
        results.appendChild(li);
      });
    }

    function snippet(content, needle) {
      var idx = content.toLowerCase().indexOf(needle);
      if (idx === -1) {
        return content.slice(0, 160) + (content.length > 160 ? '...' : '');
      }
      var start = Math.max(0, idx - 60);
      var end = Math.min(content.length, idx + needle.length + 100);
      return (
        (start > 0 ? '...' : '') +
        content.slice(start, end) +
        (end < content.length ? '...' : '')
      );
    }
  })();
</script>

{{- end -}}
