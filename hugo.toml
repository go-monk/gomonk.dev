baseURL = 'https://gomonk.dev/'
locale = 'en-us'
title = 'Go monk'
theme = 'paper'

[params]
  description = 'Go programming, infrastructure and security'
  mainSections = ['posts']          # home lists posts only; without this Hugo picks the biggest section

  # header social icons
  github = 'go-monk'                # github.com/YOUR_GITHUB_ID
  linkedin = 'go-monk'              # linkedin.com/in/YOUR_LINKEDIN_ID
  bluesky = 'go-monk.bsky.social'   # https://bsky.app/profile/YOUR_BLUESKY_ID

  favicon = "favicon.png"           # customize the default favicon
  appleTouchIcon = "favicon.png"    # customize the default Apple touch icon
  disableHLJS = true                # Hugo's chroma already highlights at build time

[caches]
  [caches.images]
    dir = ':cacheDir/images'
  [caches.getresource]
    maxAge = '10m'                  # comment counts for the listing; the default never refetches

[markup]
  [markup.highlight]
    noClasses = false               # code colours come from assets/custom.css
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "collectables"
    name = "Collectables"
    url = "/collectables/"
    weight = 1
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 5
  [[menu.main]]
    identifier = "subscribe"
    name = "Subscribe"
    url = "/subscribe/"
    weight = 10

[params.giscus]
  repo = 'go-monk/gomonk.dev'                 # see https://giscus.app for more details
  repoId = 'R_kgDOTThTCg'
  category = 'Announcements'
  categoryId = 'DIC_kwDOTThTCs4DA6Tt'
  mapping = 'pathname'
  theme = 'preferred_color_scheme'
  lang = 'en'